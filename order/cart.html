<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — Charroti Kitchen</title>
  <link rel="stylesheet" href="css/order-base.css" />
  <link rel="stylesheet" href="css/cart.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="app-topnav"></div>

    <main class="page-container">
      <div class="page-header">
        <h1>Your Cart</h1>
        <p>Review your items before checkout.</p>
      </div>

      <div class="cart-layout" id="cart-layout" style="display:none;">
        <div class="card" id="cart-items-card"></div>

        <div class="card card--padded cart-summary">
          <h3 style="margin-bottom: var(--space-4);">Order Summary</h3>
          <div id="free-delivery-note"></div>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="summary-subtotal">₹0</span>
          </div>
          <div class="summary-row">
            <span>Delivery Charge</span>
            <span id="summary-delivery">₹0</span>
          </div>
          <div class="summary-row summary-row--total">
            <span>Total</span>
            <span id="summary-total">₹0</span>
          </div>
          <button type="button" class="btn btn--primary btn--block" id="checkout-btn" style="margin-top: var(--space-4);">
            Proceed to Checkout
          </button>
        </div>
      </div>

      <div id="cart-empty-state"></div>
    </main>

    <p class="footer-note">Charroti Kitchen Ordering</p>
  </div>

  <script type="module" src="js/pages/cart.js"></script>
</body>
</html>
