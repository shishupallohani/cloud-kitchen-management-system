<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Charroti Kitchen</title>
  <link rel="stylesheet" href="css/order-base.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="card auth-card">
      <div class="auth-brand">
        <div class="auth-brand__logo">🍛</div>
        <div class="auth-brand__name">Charroti Kitchen</div>
      </div>

      <h2>Reset your password</h2>
      <p class="auth-subtitle">Enter your registered email and we'll send you a password reset link.</p>

      <div id="form-message" class="auth-form-message"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="forgot-submit-btn">Send Reset Link</button>
      </form>

      <p class="auth-footer-text">
        Remembered your password? <a href="login.html">Back to Login</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/pages/forgot-password.js"></script>
</body>
</html>
