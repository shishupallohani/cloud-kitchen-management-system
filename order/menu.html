<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — Charroti Kitchen</title>
  <link rel="stylesheet" href="css/order-base.css" />
  <link rel="stylesheet" href="css/menu.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="app-topnav"></div>

    <main class="page-container">
      <div class="menu-marquee" id="menu-marquee" hidden>
        <div class="menu-marquee__track">
          <span class="menu-marquee__item">
            Fresh Every Day <span class="menu-marquee__dot">✦</span>
            Hygienic Kitchen <span class="menu-marquee__dot">✦</span>
            Quality Ingredients <span class="menu-marquee__dot">✦</span>
            चार रोटी किचन <span class="menu-marquee__dot">✦</span>
            Ghar Ka Khana <span class="menu-marquee__dot">✦</span>
          </span>
          <span class="menu-marquee__item" aria-hidden="true">
            Fresh Every Day <span class="menu-marquee__dot">✦</span>
            Hygienic Kitchen <span class="menu-marquee__dot">✦</span>
            Quality Ingredients <span class="menu-marquee__dot">✦</span>
            चार रोटी किचन <span class="menu-marquee__dot">✦</span>
            Ghar Ka Khana <span class="menu-marquee__dot">✦</span>
          </span>
        </div>
      </div>

      <div class="page-header">
        <h1>Explore Menu</h1>
        <p>Freshly prepared, ready to order.</p>
      </div>

      <div class="category-tabs" id="category-tabs"></div>
      <div id="menu-content"></div>
    </main>

    <p class="footer-note">Charroti Kitchen Ordering</p>
  </div>

  <script type="module" src="js/pages/menu.js"></script>
</body>
</html>
