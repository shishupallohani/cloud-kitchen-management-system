<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Charroti Kitchen</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body admin-body--centered">
  <main class="login-card">
    <div class="login-card__brand">
      <img src="assets/icons/logo-mark.svg" alt="" width="30" height="30" />
      <span>Charroti Kitchen</span>
    </div>
    <h1>Admin Login</h1>
    <p class="login-card__hint">Sign in to manage today's menu.</p>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <p id="login-error" class="form-error" role="alert" hidden></p>

      <button type="submit" class="btn btn--primary btn--block" id="login-submit">Sign In</button>
    </form>

    <a href="index.html" class="login-card__back">← Back to website</a>
  </main>

  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
